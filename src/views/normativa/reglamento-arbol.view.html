<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reglamento AIR-TEC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }

    header {
      background: #003366;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 20px; }
    header p { font-size: 13px; opacity: 0.8; }

    .rol-badge {
      margin-left: auto;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 99px;
      background: rgba(255,255,255,0.2);
    }

    .container { display: flex; height: calc(100vh - 70px); }

    .tree-panel {
      width: 380px;
      background: white;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      padding: 16px;
    }
    .tree-panel h2 { font-size: 14px; color: #666; margin-bottom: 12px; text-transform: uppercase; }

    .tree-node { margin: 2px 0; }
    .tree-node-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .tree-node-header:hover { background: #f0f4ff; }
    .tree-node-header.selected { background: #e8f0fe; border-left: 3px solid #003366; }

    .tree-node-children { margin-left: 20px; border-left: 1px dashed #ccc; padding-left: 8px; }
    .tree-node-children.hidden { display: none; }

    .toggle-btn { width: 18px; height: 18px; font-size: 12px; background: none; border: none; cursor: pointer; color: #666; flex-shrink: 0; }
    .nivel-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 99px;
      font-weight: bold;
      flex-shrink: 0;
    }
    .nivel-TITULO { background: #003366; color: white; }
    .nivel-CAPITULO { background: #0066cc; color: white; }
    .nivel-ARTICULO { background: #4a90d9; color: white; }
    .nivel-INCISO { background: #a8c8f0; color: #003366; }

    .vigencia-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 99px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .VIGENTE { background: #e6f4ea; color: #1e7e34; }
    .HISTORICA { background: #fce8e6; color: #c62828; }

    .node-titulo { font-size: 13px; flex: 1; }

    .detail-panel {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }
    .detail-panel h2 { font-size: 22px; color: #003366; margin-bottom: 8px; }
    .detail-meta { font-size: 13px; color: #666; margin-bottom: 16px; display: flex; gap: 12px; flex-wrap: wrap; }
    .detail-content { font-size: 15px; line-height: 1.8; color: #444; background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
    .detail-empty { color: #aaa; font-size: 15px; margin-top: 40px; text-align: center; }

    .form-panel {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }
    .form-panel h3 { font-size: 16px; color: #003366; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
    }
    .form-group textarea { height: 100px; resize: vertical; }
    .btn-primary {
      background: #003366; color: white; border: none; padding: 10px 20px;
      border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .btn-primary:hover { background: #004499; }
    .btn-version {
      background: #28a745; color: white; border: none; padding: 10px 20px;
      border-radius: 6px; cursor: pointer; font-size: 14px; margin-left: 8px;
    }
    .readonly-msg {
      color: #999; font-style: italic; margin-top: 16px; font-size: 14px;
      padding: 12px; background: #f9f9f9; border-radius: 6px; border: 1px solid #eee;
    }

    .notification {
      position: fixed; top: 20px; right: 20px;
      padding: 12px 20px; border-radius: 8px; font-size: 14px;
      display: none; z-index: 9999;
    }
    .notification.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .notification.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Reglamento AIR-TEC</h1>
    <p>Asamblea Institucional Representativa — Instituto Tecnológico de Costa Rica</p>
  </div>
  <span class="rol-badge" id="rol-badge">Cargando...</span>
</header>

<div class="notification" id="notification"></div>

<div class="container">
  <div class="tree-panel">
    <h2>Estructura Normativa</h2>
    <div id="tree-container">Cargando...</div>
  </div>

  <div class="detail-panel" id="detail-panel">
    <p class="detail-empty">Seleccioná un elemento del árbol para ver su contenido</p>
  </div>
</div>

<script>
  const API_BASE = 'http://localhost:3000/api';
  let token = localStorage.getItem('firebase_token') || '';
  const rol = localStorage.getItem('user_rol') || 'ASAMBLEISTA';
  const puedeEditar = rol === 'SECRETARIA' || rol === 'ADMINISTRADOR';

  let arbolData = [];
  let nodoSeleccionado = null;

  // Mostrar rol en header
  document.getElementById('rol-badge').textContent = rol;

  async function cargarArbol() {
    try {
      const res = await fetch(`${API_BASE}/normativa/arbol`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('Error al cargar');
      arbolData = await res.json();
      renderArbol(arbolData, document.getElementById('tree-container'));
    } catch (e) {
      document.getElementById('tree-container').innerHTML = '<p style="color:red">Error al cargar la normativa</p>';
    }
  }

  function renderArbol(nodos, contenedor) {
    contenedor.innerHTML = '';
    nodos.forEach(nodo => {
      const div = document.createElement('div');
      div.className = 'tree-node';

      const tieneHijos = nodo.hijos && nodo.hijos.length > 0;
      div.innerHTML = `
        <div class="tree-node-header" onclick="seleccionarNodo(${nodo.ID_NORMATIVA}, this)">
          <button class="toggle-btn" onclick="toggleHijos(event, ${nodo.ID_NORMATIVA})">${tieneHijos ? '▶' : '·'}</button>
          <span class="nivel-badge nivel-${nodo.NIVEL}">${nodo.NIVEL}</span>
          <span class="node-titulo">${nodo.TITULO}</span>
          <span class="vigencia-badge ${nodo.ESTADO_VIGENCIA}">${nodo.ESTADO_VIGENCIA}</span>
        </div>
        <div class="tree-node-children hidden" id="hijos-${nodo.ID_NORMATIVA}"></div>
      `;
      contenedor.appendChild(div);

      if (tieneHijos) {
        renderArbol(nodo.hijos, div.querySelector(`#hijos-${nodo.ID_NORMATIVA}`));
      }
    });
  }

  function toggleHijos(event, id) {
    event.stopPropagation();
    const hijos = document.getElementById(`hijos-${id}`);
    const btn = event.target;
    if (hijos.classList.contains('hidden')) {
      hijos.classList.remove('hidden');
      btn.textContent = '▼';
    } else {
      hijos.classList.add('hidden');
      btn.textContent = '▶';
    }
  }

  function seleccionarNodo(id, header) {
    document.querySelectorAll('.tree-node-header').forEach(h => h.classList.remove('selected'));
    header.classList.add('selected');

    const nodo = buscarNodo(arbolData, id);
    if (!nodo) return;
    nodoSeleccionado = nodo;

    const niveles = { TITULO: 0, CAPITULO: 1, ARTICULO: 2, INCISO: 3 };
    const hijosPosibles = ['CAPITULO', 'ARTICULO', 'INCISO'];
    const nivelHijo = hijosPosibles[niveles[nodo.NIVEL]];

    const formulariosHTML = puedeEditar ? `
      <div class="form-panel" style="margin-top:20px">
        <h3>Publicar nueva versión</h3>
        <div class="form-group">
          <label>Nuevo contenido</label>
          <textarea id="nuevo-contenido" placeholder="Ingresá el nuevo texto..."></textarea>
        </div>
        <button class="btn-version" onclick="publicarVersion(${nodo.ID_NORMATIVA}, '${nodo.CODIGO}', '${nodo.NIVEL}', '${nodo.TITULO}', ${nodo.ID_PADRE || null})">
          Publicar nueva versión
        </button>
      </div>
      ${nivelHijo ? `
      <div class="form-panel">
        <h3>Agregar ${nivelHijo}</h3>
        <div class="form-group">
          <label>Código</label>
          <input type="text" id="nuevo-codigo" placeholder="Ej: ${nodo.CODIGO}-C1">
        </div>
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="nuevo-titulo" placeholder="Título del ${nivelHijo.toLowerCase()}">
        </div>
        <div class="form-group">
          <label>Contenido</label>
          <textarea id="nuevo-contenido-hijo" placeholder="Contenido..."></textarea>
        </div>
        <button class="btn-primary" onclick="agregarHijo('${nivelHijo}', ${nodo.ID_NORMATIVA})">
          Agregar ${nivelHijo}
        </button>
      </div>` : ''}
    ` : '<p class="readonly-msg">🔒 Solo lectura — su rol de Asambleísta no permite editar la normativa.</p>';

    document.getElementById('detail-panel').innerHTML = `
      <h2>${nodo.TITULO}</h2>
      <div class="detail-meta">
        <span class="nivel-badge nivel-${nodo.NIVEL}">${nodo.NIVEL}</span>
        <span class="vigencia-badge ${nodo.ESTADO_VIGENCIA}">${nodo.ESTADO_VIGENCIA}</span>
        <span>Código: ${nodo.CODIGO}</span>
        <span>Versión: ${nodo.VERSION}</span>
      </div>
      <div class="detail-content">${nodo.CONTENIDO || '<em>Sin contenido</em>'}</div>
      ${formulariosHTML}
    `;
  }

  function buscarNodo(nodos, id) {
    for (const nodo of nodos) {
      if (nodo.ID_NORMATIVA === id) return nodo;
      if (nodo.hijos) {
        const encontrado = buscarNodo(nodo.hijos, id);
        if (encontrado) return encontrado;
      }
    }
    return null;
  }

  async function publicarVersion(idPadre, codigo, nivel, titulo, padre) {
    const contenido = document.getElementById('nuevo-contenido').value;
    if (!contenido) { mostrarNotificacion('Ingresá el nuevo contenido', 'error'); return; }

    try {
      const res = await fetch(`${API_BASE}/normativa`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ codigo, nivel, titulo, contenido, id_padre: padre })
      });
      if (!res.ok) throw new Error('Error');
      mostrarNotificacion('Nueva versión publicada — la anterior pasó a Histórica ✅', 'success');
      setTimeout(() => cargarArbol(), 1000);
    } catch (e) {
      mostrarNotificacion('Error al publicar versión', 'error');
    }
  }

  async function agregarHijo(nivel, idPadre) {
    const codigo = document.getElementById('nuevo-codigo').value;
    const titulo = document.getElementById('nuevo-titulo').value;
    const contenido = document.getElementById('nuevo-contenido-hijo').value;

    if (!codigo || !titulo) { mostrarNotificacion('Código y título son obligatorios', 'error'); return; }

    try {
      const res = await fetch(`${API_BASE}/normativa`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ codigo, nivel, titulo, contenido, id_padre: idPadre })
      });
      const data = await res.json();
      if (!res.ok) { mostrarNotificacion(data.error, 'error'); return; }
      mostrarNotificacion(`${nivel} agregado exitosamente ✅`, 'success');
      setTimeout(() => cargarArbol(), 1000);
    } catch (e) {
      mostrarNotificacion('Error al agregar', 'error');
    }
  }

  function mostrarNotificacion(msg, tipo) {
    const n = document.getElementById('notification');
    n.textContent = msg;
    n.className = `notification ${tipo}`;
    n.style.display = 'block';
    setTimeout(() => n.style.display = 'none', 3000);
  }

  cargarArbol();
</script>

</body>
</html>
