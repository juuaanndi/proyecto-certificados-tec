<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asambleístas AIR-TEC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
    header { background: #003366; color: white; padding: 16px 24px; }
    header h1 { font-size: 20px; }
    header p { font-size: 13px; opacity: 0.8; }

    .container { padding: 24px; max-width: 1200px; margin: 0 auto; }

    .filtros {
      background: white; padding: 16px; border-radius: 8px;
      border: 1px solid #ddd; margin-bottom: 20px;
      display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
    }
    .filtro-group { display: flex; flex-direction: column; gap: 4px; }
    .filtro-group label { font-size: 12px; color: #666; }
    .filtro-group input, .filtro-group select {
      padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
    }
    .btn-buscar {
      background: #003366; color: white; border: none;
      padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .btn-nuevo {
      background: #28a745; color: white; border: none;
      padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-left: auto;
    }

    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; }
    th { background: #003366; color: white; padding: 12px 16px; text-align: left; font-size: 13px; }
    td { padding: 12px 16px; border-bottom: 1px solid #eee; font-size: 14px; }
    tr:hover td { background: #f0f4ff; }

    .btn-ver {
      background: #0066cc; color: white; border: none;
      padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px;
    }

    .notification {
      position: fixed; top: 20px; right: 20px;
      padding: 12px 20px; border-radius: 8px; font-size: 14px;
      display: none; z-index: 9999;
    }
    .notification.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .notification.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    .empty { text-align: center; padding: 40px; color: #aaa; }
  </style>
</head>
<body>

<header>
  <h1>Gestión de Asambleístas</h1>
  <p>Asamblea Institucional Representativa — Instituto Tecnológico de Costa Rica</p>
</header>

<div class="notification" id="notification"></div>

<div class="container">
  <div class="filtros">
    <div class="filtro-group">
      <label>Buscar por nombre</label>
      <input type="text" id="filtro-nombre" placeholder="Nombre del asambleísta">
    </div>
    <div class="filtro-group">
      <label>Buscar por cédula</label>
      <input type="text" id="filtro-cedula" placeholder="Número de cédula">
    </div>
    <button class="btn-buscar" onclick="buscar()">Buscar</button>
    <button class="btn-nuevo" onclick="window.location.href='asambleista-registro.view.html'">+ Nuevo Asambleísta</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Cédula</th>
        <th>Correo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla-body">
      <tr><td colspan="5" class="empty">Cargando...</td></tr>
    </tbody>
  </table>
</div>

<script>
  const API_BASE = 'http://localhost:3000/api';
  const token = localStorage.getItem('firebase_token') || '';
  let asambleistas = [];

  async function cargarAsambleistas() {
    try {
      const res = await fetch(`${API_BASE}/asambleistas`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('Error al cargar');
      asambleistas = await res.json();
      renderTabla(asambleistas);
    } catch (e) {
      document.getElementById('tabla-body').innerHTML = '<tr><td colspan="5" class="empty">Error al cargar asambleístas</td></tr>';
    }
  }

  function renderTabla(datos) {
    const tbody = document.getElementById('tabla-body');
    if (!datos.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">No se encontraron asambleístas</td></tr>';
      return;
    }
    tbody.innerHTML = datos.map(a => `
      <tr>
        <td>${a.ID_ASAMBLEISTA}</td>
        <td>${a.NOMBRE}</td>
        <td>${a.CEDULA}</td>
        <td>${a.CORREO}</td>
        <td><button class="btn-ver" onclick="verDetalle(${a.ID_ASAMBLEISTA})">Ver detalle</button></td>
      </tr>
    `).join('');
  }

  function buscar() {
    const nombre = document.getElementById('filtro-nombre').value.toLowerCase();
    const cedula = document.getElementById('filtro-cedula').value;
    const filtrados = asambleistas.filter(a =>
      (!nombre || a.NOMBRE.toLowerCase().includes(nombre)) &&
      (!cedula || a.CEDULA.includes(cedula))
    );
    renderTabla(filtrados);
  }

  function verDetalle(id) {
    window.location.href = `asambleista-registro.html?id=${id}`;
  }

  cargarAsambleistas();
</script>
</body>
</html>
