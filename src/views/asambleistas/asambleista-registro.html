<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Asambleísta AIR-TEC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
    header { background: #003366; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 20px; }
    .btn-back { background: none; border: 1px solid white; color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }

    .container { padding: 24px; max-width: 900px; margin: 0 auto; }

    .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 16px; color: #003366; margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 8px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 13px; color: #555; }
    .form-group input, .form-group select {
      padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #003366; }

    .btn-primary { background: #003366; color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-primary:hover { background: #004499; }
    .btn-danger { background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }

    /* Maestro-Detalle Nombramientos */
    .nombramientos-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn-add { background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }

    table { width: 100%; border-collapse: collapse; }
    th { background: #f0f4ff; color: #003366; padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 2px solid #ddd; }
    td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 13px; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
    .modal { background: white; border-radius: 8px; padding: 24px; width: 500px; margin: 10% auto; }
    .modal h3 { font-size: 16px; color: #003366; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .btn-cancel { background: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

    .estado-ACTIVO { color: #28a745; font-weight: bold; }
    .estado-INACTIVO { color: #dc3545; }

    .notification { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 14px; display: none; z-index: 9999; }
    .notification.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .notification.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

<header>
  <button class="btn-back" onclick="window.location.href='asambleista-lista.html'">← Volver</button>
  <div>
    <h1 id="page-title">Nuevo Asambleísta</h1>
  </div>
</header>

<div class="notification" id="notification"></div>

<div class="container">
  <!-- Datos personales -->
  <div class="card">
    <h2>Datos Personales</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Nombre completo *</label>
        <input type="text" id="nombre" placeholder="Nombre completo">
      </div>
      <div class="form-group">
        <label>Cédula *</label>
        <input type="text" id="cedula" placeholder="000000000">
      </div>
      <div class="form-group full">
        <label>Correo electrónico</label>
        <input type="email" id="correo" placeholder="correo@tec.ac.cr">
      </div>
    </div>
    <br>
    <button class="btn-primary" onclick="guardarAsambleista()">Guardar</button>
  </div>

  <!-- Maestro-Detalle Nombramientos -->
  <div class="card" id="card-nombramientos" style="display:none">
    <div class="nombramientos-header">
      <h2>Nombramientos</h2>
      <button class="btn-add" onclick="abrirModalNombramiento()">+ Agregar Nombramiento</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Puesto</th>
          <th>Sector</th>
          <th>Condición</th>
          <th>Inicio</th>
          <th>Fin</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="tabla-nombramientos">
        <tr><td colspan="6" style="text-align:center;color:#aaa">Sin nombramientos</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Nombramiento -->
<div class="modal-overlay" id="modal-nombramiento">
  <div class="modal">
    <h3>Nuevo Nombramiento</h3>
    <div class="form-group" style="margin-bottom:12px">
      <label>Puesto *</label>
      <input type="text" id="nom-puesto" placeholder="Ej: Representante Sector Docente">
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label>Sector *</label>
      <select id="nom-sector">
        <option value="1">Docente</option>
        <option value="2">Administrativo</option>
        <option value="3">Estudiantil</option>
        <option value="4">Consejo Institucional</option>
      </select>
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label>Condición</label>
      <select id="nom-condicion">
        <option value="TITULAR">Titular</option>
        <option value="SUPLENTE">Suplente</option>
      </select>
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label>Fecha inicio *</label>
      <input type="date" id="nom-inicio">
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label>Fecha fin</label>
      <input type="date" id="nom-fin">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-primary" onclick="guardarNombramiento()">Guardar</button>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'http://localhost:3000/api';
  const token = localStorage.getItem('firebase_token') || '';
  const params = new URLSearchParams(window.location.search);
  const idAsambleista = params.get('id');
  let asambleistaActual = null;

  async function init() {
    if (idAsambleista) {
      document.getElementById('page-title').textContent = 'Editar Asambleísta';
      await cargarAsambleista();
      await cargarNombramientos();
      document.getElementById('card-nombramientos').style.display = 'block';
    }
  }

  async function cargarAsambleista() {
    try {
      const res = await fetch(`${API_BASE}/asambleistas/${idAsambleista}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      asambleistaActual = await res.json();
      document.getElementById('nombre').value = asambleistaActual.NOMBRE;
      document.getElementById('cedula').value = asambleistaActual.CEDULA;
      document.getElementById('correo').value = asambleistaActual.CORREO || '';
    } catch (e) {
      mostrarNotificacion('Error al cargar asambleísta', 'error');
    }
  }

  async function cargarNombramientos() {
  try {
    const res = await fetch(`${API_BASE}/nombramientos`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const todos = await res.json();
    console.log('todos:', todos);
    console.log('idAsambleista:', idAsambleista, typeof idAsambleista);
    const mios = todos.filter(n => String(n.ID_ASAMBLEISTA) === String(idAsambleista));
    console.log('mios:', mios);
    const tbody = document.getElementById('tabla-nombramientos');
    if (!mios.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#aaa">Sin nombramientos</td></tr>';
      return;
    }
    tbody.innerHTML = mios.map(n => `
      <tr>
        <td>${n.PUESTO}</td>
        <td>${n.ID_SECTOR}</td>
        <td>${n.CONDICION}</td>
        <td>${n.INICIO ? new Date(n.INICIO).toLocaleDateString('es-CR') : '-'}</td>
        <td>${n.FIN ? new Date(n.FIN).toLocaleDateString('es-CR') : 'Vigente'}</td>
        <td class="estado-${n.ESTADO}">${n.ESTADO}</td>
      </tr>
    `).join('');
  } catch (e) {
    mostrarNotificacion('Error al cargar nombramientos', 'error');
  }
}

  async function guardarAsambleista() {
    const nombre = document.getElementById('nombre').value;
    const cedula = document.getElementById('cedula').value;
    const correo = document.getElementById('correo').value;

    if (!nombre || !cedula) {
      mostrarNotificacion('Nombre y cédula son obligatorios', 'error');
      return;
    }

    // Validar formato cédula
    if (!/^\d{9,12}$/.test(cedula)) {
      mostrarNotificacion('La cédula debe tener entre 9 y 12 dígitos', 'error');
      return;
    }

    mostrarNotificacion('Asambleísta guardado exitosamente', 'success');
    setTimeout(() => {
      document.getElementById('card-nombramientos').style.display = 'block';
    }, 500);
  }

  function abrirModalNombramiento() {
    document.getElementById('modal-nombramiento').style.display = 'block';
  }

  function cerrarModal() {
    document.getElementById('modal-nombramiento').style.display = 'none';
  }

  async function guardarNombramiento() {
    const puesto = document.getElementById('nom-puesto').value;
    const condicion = document.getElementById('nom-condicion').value;
    const inicio = document.getElementById('nom-inicio').value;
    const fin = document.getElementById('nom-fin').value;

    if (!puesto || !inicio) {
      mostrarNotificacion('Puesto y fecha de inicio son obligatorios', 'error');
      return;
    }

    if (fin && inicio > fin) {
      mostrarNotificacion('La fecha de fin no puede ser anterior al inicio', 'error');
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/nombramientos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({
          id_asambleista: parseInt(idAsambleista),
          id_periodo: 1,
          id_sector: parseInt(document.getElementById('nom-sector').value),
          puesto: puesto,
          condicion: condicion,
          inicio: inicio,
          fin: fin || null,
          estado: 'VIGENTE'
        })
      });
      const data = await res.json();
      if (!res.ok) { mostrarNotificacion(data.error || 'Error al guardar', 'error'); return; }
      cerrarModal();
      mostrarNotificacion('Nombramiento agregado exitosamente', 'success');
      await cargarNombramientos();
    } catch (e) {
      mostrarNotificacion('Error al guardar nombramiento', 'error');
    }
  }

  function mostrarNotificacion(msg, tipo) {
    const n = document.getElementById('notification');
    n.textContent = msg;
    n.className = `notification ${tipo}`;
    n.style.display = 'block';
    setTimeout(() => n.style.display = 'none', 3000);
  }

  init();
</script>
</body>
</html>
